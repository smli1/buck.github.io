<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ RPG Character Select</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --slot-bg: #1a1a24;
            --slot-border: #2e2e3a;
            --slot-hover: #252536;
            --slot-active: #1e3a5f;
            --race-color: #f59e0b;
            --class-color: #8b5cf6;
        }

        body {
            overflow-y: auto;
            height: auto;
            min-height: 100vh;
        }

        .cs-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .cs-header h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .cs-header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cs-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .cs-status.ok { color: var(--success); border-color: rgba(34,197,94,0.3); }
        .cs-status.loading { color: var(--warning); border-color: rgba(245,158,11,0.3); }

        .cs-slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .cs-slot {
            background: var(--slot-bg);
            border: 2px solid var(--slot-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 200ms ease;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cs-slot:hover {
            border-color: var(--secondary);
            background: var(--slot-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .cs-slot.active {
            border-color: var(--primary);
            background: var(--slot-active);
            box-shadow: 0 0 0 3px rgba(21, 170, 125, 0.15);
        }

        .cs-slot.empty-slot {
            border-style: dashed;
            border-color: var(--border-color);
            opacity: 0.7;
            justify-content: center;
            align-items: center;
            min-height: 160px;
        }

        .cs-slot.empty-slot:hover {
            opacity: 1;
            border-color: var(--primary);
        }

        .cs-slot-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .cs-slot-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            word-break: break-word;
        }

        .cs-slot-level {
            background: rgba(139, 92, 246, 0.2);
            color: var(--class-color);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .cs-slot-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cs-tag {
            font-size: 0.78rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .cs-tag.race {
            background: rgba(245, 158, 11, 0.15);
            color: var(--race-color);
        }

        .cs-tag.class {
            background: rgba(139, 92, 246, 0.15);
            color: var(--class-color);
        }

        .cs-tag.background {
            background: rgba(34, 197, 94, 0.12);
            color: var(--success);
        }

        .cs-slot-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .cs-stat-mini {
            text-align: center;
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
            padding: 4px;
        }

        .cs-stat-mini-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cs-stat-mini-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .cs-slot-actions {
            display: flex;
            gap: 6px;
            margin-top: auto;
            padding-top: 8px;
        }

        .cs-slot-actions .btn {
            flex: 1;
            padding: 6px 8px;
            font-size: 0.8rem;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .btn-launch {
            background: linear-gradient(135deg, var(--primary), #0d9668);
            color: #fff;
        }

        .btn-ghost {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.12);
        }

        /* Editor Panel */
        .cs-editor-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
            opacity: 1;
            transition: opacity 200ms ease;
        }

        .cs-editor-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            display: none !important;
        }

        .cs-editor {
            background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(2,8,23,0.98));
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: min(96%, 680px);
            max-height: min(90vh, 800px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }

        .cs-editor-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17,24,39,0.9);
        }

        .cs-editor-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #fff;
        }

        .cs-editor-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .cs-form-section {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 14px;
            display: grid;
            gap: 10px;
        }

        .cs-form-section-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--secondary);
            margin-bottom: 2px;
        }

        .cs-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .cs-form-row.three-col {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .cs-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cs-field label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .cs-field input,
        .cs-field select,
        .cs-field textarea {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text-main);
            font-size: 0.92rem;
        }

        .cs-field input:focus,
        .cs-field select:focus,
        .cs-field textarea:focus {
            outline: none;
            border-color: rgba(96, 165, 250, 0.6);
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.15);
        }

        .cs-field textarea {
            resize: vertical;
            min-height: 60px;
        }

        .cs-abilities-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .cs-ability-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
        }

        .cs-ability-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cs-ability-input input {
            width: 100%;
            text-align: center;
            padding: 6px 4px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-main);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .cs-ability-mod {
            font-size: 0.8rem;
            color: var(--secondary);
            font-weight: 600;
        }

        .cs-editor-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            background: rgba(17,24,39,0.6);
        }

        .cs-editor-footer .btn {
            flex: 0 1 160px;
            padding: 10px 16px;
        }

        /* Empty state */
        .cs-empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .cs-empty-state h2 {
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* Confirm dialog */
        .cs-confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .cs-confirm-overlay.hidden {
            display: none;
        }

        .cs-confirm-box {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            max-width: 380px;
            text-align: center;
        }

        .cs-confirm-box p {
            margin: 0 0 16px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .cs-confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .cs-confirm-actions .btn {
            flex: 0 1 120px;
        }

        @media (max-width: 600px) {
            .cs-abilities-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .cs-form-row {
                grid-template-columns: 1fr;
            }
            .cs-form-row.three-col {
                grid-template-columns: 1fr 1fr;
            }
            .cs-slots-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="cs-container">
        <div class="cs-header">
            <h1>⚔️ Character Select</h1>
            <div class="cs-header-actions">
                <span id="cs-status" class="cs-status loading">Loading roster…</span>
                <button class="btn btn-ghost" style="flex:0; padding:8px 14px;" onclick="reloadRoster()">↻ Reload</button>
                <button class="btn btn-ghost" style="flex:0; padding:8px 14px;" onclick="exportRoster()">⬇ Export files</button>
                <button class="btn" style="flex:0; padding:8px 14px;" onclick="openEditor(null)">+ New Character</button>
                <a class="btn btn-ghost" style="flex:0; padding:8px 14px; text-decoration:none;" href="character-creator.html">✨ Guided Creator</a>
            </div>
        </div>

        <div id="cs-slots" class="cs-slots-grid"></div>
    </div>

    <!-- Editor Overlay -->
    <div id="cs-editor-overlay" class="cs-editor-overlay hidden">
        <div class="cs-editor">
            <div class="cs-editor-header">
                <h2 id="cs-editor-title">New Character</h2>
                <button class="btn-icon" onclick="closeEditor()">✕</button>
            </div>
            <div class="cs-editor-body">
                <div class="cs-form-section">
                    <div class="cs-form-section-title">Basic Info</div>
                    <div class="cs-form-row">
                        <div class="cs-field">
                            <label>Character Name</label>
                            <input id="cs-name" type="text" placeholder="e.g. Aragorn" />
                        </div>
                        <div class="cs-field">
                            <label>Level</label>
                            <input id="cs-level" type="number" min="1" max="20" value="1" />
                        </div>
                    </div>
                    <div class="cs-form-row three-col">
                        <div class="cs-field">
                            <label>Race</label>
                            <select id="cs-race">
                                <option value="">-- Select --</option>
                                <option value="Human">Human</option>
                                <option value="Elf">Elf</option>
                                <option value="Dwarf">Dwarf</option>
                                <option value="Halfling">Halfling</option>
                                <option value="Half-Elf">Half-Elf</option>
                                <option value="Half-Orc">Half-Orc</option>
                                <option value="Tiefling">Tiefling</option>
                                <option value="Dragonborn">Dragonborn</option>
                                <option value="Gnome">Gnome</option>
                                <option value="Goliath">Goliath</option>
                                <option value="Aasimar">Aasimar</option>
                                <option value="Firbolg">Firbolg</option>
                                <option value="Kenku">Kenku</option>
                                <option value="Tabaxi">Tabaxi</option>
                                <option value="Tortle">Tortle</option>
                                <option value="Bugbear">Bugbear</option>
                                <option value="Goblin">Goblin</option>
                                <option value="Hobgoblin">Hobgoblin</option>
                                <option value="Kobold">Kobold</option>
                                <option value="Orc">Orc</option>
                                <option value="Yuan-Ti">Yuan-Ti Pureblood</option>
                            </select>
                        </div>
                        <div class="cs-field">
                            <label>Class</label>
                            <select id="cs-class">
                                <option value="">-- Select --</option>
                                <option value="Barbarian">Barbarian</option>
                                <option value="Bard">Bard</option>
                                <option value="Cleric">Cleric</option>
                                <option value="Druid">Druid</option>
                                <option value="Fighter">Fighter</option>
                                <option value="Monk">Monk</option>
                                <option value="Paladin">Paladin</option>
                                <option value="Ranger">Ranger</option>
                                <option value="Rogue">Rogue</option>
                                <option value="Sorcerer">Sorcerer</option>
                                <option value="Warlock">Warlock</option>
                                <option value="Wizard">Wizard</option>
                            </select>
                        </div>
                        <div class="cs-field">
                            <label>Background</label>
                            <select id="cs-background">
                                <option value="">-- Select --</option>
                                <option value="Acolyte">Acolyte</option>
                                <option value="Charlatan">Charlatan</option>
                                <option value="Criminal">Criminal</option>
                                <option value="Entertainer">Entertainer</option>
                                <option value="Folk Hero">Folk Hero</option>
                                <option value="Guild Artisan">Guild Artisan</option>
                                <option value="Hermit">Hermit</option>
                                <option value="Noble">Noble</option>
                                <option value="Outlander">Outlander</option>
                                <option value="Sage">Sage</option>
                                <option value="Sailor">Sailor</option>
                                <option value="Soldier">Soldier</option>
                                <option value="Urchin">Urchin</option>
                            </select>
                        </div>
                    </div>
                    <div class="cs-form-row">
                        <div class="cs-field">
                            <label>Alignment</label>
                            <select id="cs-alignment">
                                <option value="">-- Select --</option>
                                <option value="Lawful Good">Lawful Good</option>
                                <option value="Neutral Good">Neutral Good</option>
                                <option value="Chaotic Good">Chaotic Good</option>
                                <option value="Lawful Neutral">Lawful Neutral</option>
                                <option value="True Neutral">True Neutral</option>
                                <option value="Chaotic Neutral">Chaotic Neutral</option>
                                <option value="Lawful Evil">Lawful Evil</option>
                                <option value="Neutral Evil">Neutral Evil</option>
                                <option value="Chaotic Evil">Chaotic Evil</option>
                            </select>
                        </div>
                        <div class="cs-field">
                            <label>Data Source</label>
                            <select id="cs-source">
                                <option value="">-- Select --</option>
                                <option value="PHB">PHB 2014</option>
                                <option value="XPHB">PHB 2024</option>
                                <option value="XGE">Xanathar's Guide</option>
                                <option value="TCE">Tasha's Cauldron</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="cs-form-section">
                    <div class="cs-form-section-title">Ability Scores</div>
                    <div class="cs-abilities-grid">
                        <div class="cs-ability-input">
                            <span class="cs-ability-label">STR</span>
                            <input id="cs-ability-str" type="number" min="1" max="30" value="10" oninput="updateAbilityMod(this, 'cs-mod-str')" />
                            <span class="cs-ability-mod" id="cs-mod-str">+0</span>
                        </div>
                        <div class="cs-ability-input">
                            <span class="cs-ability-label">DEX</span>
                            <input id="cs-ability-dex" type="number" min="1" max="30" value="10" oninput="updateAbilityMod(this, 'cs-mod-dex')" />
                            <span class="cs-ability-mod" id="cs-mod-dex">+0</span>
                        </div>
                        <div class="cs-ability-input">
                            <span class="cs-ability-label">CON</span>
                            <input id="cs-ability-con" type="number" min="1" max="30" value="10" oninput="updateAbilityMod(this, 'cs-mod-con')" />
                            <span class="cs-ability-mod" id="cs-mod-con">+0</span>
                        </div>
                        <div class="cs-ability-input">
                            <span class="cs-ability-label">INT</span>
                            <input id="cs-ability-int" type="number" min="1" max="30" value="10" oninput="updateAbilityMod(this, 'cs-mod-int')" />
                            <span class="cs-ability-mod" id="cs-mod-int">+0</span>
                        </div>
                        <div class="cs-ability-input">
                            <span class="cs-ability-label">WIS</span>
                            <input id="cs-ability-wis" type="number" min="1" max="30" value="10" oninput="updateAbilityMod(this, 'cs-mod-wis')" />
                            <span class="cs-ability-mod" id="cs-mod-wis">+0</span>
                        </div>
                        <div class="cs-ability-input">
                            <span class="cs-ability-label">CHA</span>
                            <input id="cs-ability-cha" type="number" min="1" max="30" value="10" oninput="updateAbilityMod(this, 'cs-mod-cha')" />
                            <span class="cs-ability-mod" id="cs-mod-cha">+0</span>
                        </div>
                    </div>
                </div>

                <div class="cs-form-section">
                    <div class="cs-form-section-title">HP & AC</div>
                    <div class="cs-form-row three-col">
                        <div class="cs-field">
                            <label>Max HP</label>
                            <input id="cs-maxhp" type="number" min="1" placeholder="Auto if empty" />
                        </div>
                        <div class="cs-field">
                            <label>AC</label>
                            <input id="cs-ac" type="number" min="1" placeholder="Auto if empty" />
                        </div>
                        <div class="cs-field">
                            <label>Hit Dice</label>
                            <select id="cs-hitdice">
                                <option value="d6">d6</option>
                                <option value="d8">d8</option>
                                <option value="d10" selected>d10</option>
                                <option value="d12">d12</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="cs-form-section">
                    <div class="cs-form-section-title">Notes</div>
                    <div class="cs-field">
                        <textarea id="cs-notes" rows="3" placeholder="Backstory, personality traits, etc."></textarea>
                    </div>
                </div>
            </div>
            <div class="cs-editor-footer">
                <button class="btn btn-icon" style="flex:0; padding:8px 16px;" onclick="closeEditor()">Cancel</button>
                <button class="btn" onclick="saveCharacter()">Save Character</button>
            </div>
        </div>
    </div>

    <!-- Export Dialog -->
    <div id="cs-export" class="cs-confirm-overlay hidden" onclick="if(event.target===this) closeExport();">
        <div class="cs-confirm-box" style="max-width:460px;width:100%;">
            <p style="font-weight:700;font-size:1rem;">Export character files</p>
            <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:12px;">Download the JSON files below, then replace the matching files under <code>data/</code> in your repo.</p>
            <div id="cs-export-list" style="display:grid;gap:6px;margin-bottom:16px;"></div>
            <div class="cs-confirm-actions" style="flex-wrap:wrap;">
                <button class="btn btn-icon" style="flex:0 1 auto;padding:8px 14px;background:rgba(255,255,255,0.08);" onclick="closeExport()">Done</button>
                <button class="btn" style="flex:0 1 auto;" onclick="downloadAllExport()">Download all</button>
            </div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div id="cs-confirm" class="cs-confirm-overlay hidden">
        <div class="cs-confirm-box">
            <p id="cs-confirm-msg">Are you sure?</p>
            <div class="cs-confirm-actions">
                <button class="btn btn-icon" style="flex:0 1 100px; padding:8px 12px; background:rgba(255,255,255,0.08);" onclick="closeConfirm()">Cancel</button>
                <button class="btn btn-delete" id="cs-confirm-ok" onclick="confirmAction()">Delete</button>
            </div>
        </div>
    </div>

    <script>
    const REGISTRY_URL = 'data/characters.json';
    const CHARACTER_DIR = 'data/characters';
    const STORAGE_KEY = 'rpg_characters_v2';
    const ABILITY_KEYS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    let characters = [];
    let localOverlay = {};
    let rosterSource = 'local'; // 'local' | 'remote'
    let editingId = null;
    let pendingConfirm = null;

    // ── Storage ──────────────────────────────────────────────
    function loadLocal() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const obj = raw ? JSON.parse(raw) : {};
            return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
        } catch (e) {
            return {};
        }
    }

    function saveLocal() {
        try {
            const obj = {};
            characters.forEach(c => { obj[c.id] = c; });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
        } catch (e) { /* ignore */ }
    }

    function makeCharacterFile(ch) {
        const c = normalizeChar(ch);
        return {
            id: c.id,
            name: c.name,
            level: c.level,
            race: c.race,
            class: c.class,
            subclass: c.subclass,
            background: c.background,
            alignment: c.alignment,
            dataSource: c.dataSource,
            proficiencyBonus: c.proficiencyBonus,
            abilityScores: c.abilityScores,
            maxHp: c.maxHp,
            maxHpOverride: c.maxHpOverride,
            currentHp: c.currentHp,
            ac: c.ac,
            acOverride: c.acOverride,
            hitDice: c.hitDice,
            armor: c.armor,
            speed: c.speed,
            longbowHit: c.longbowHit,
            longbowHitOverride: c.longbowHitOverride,
            styles: c.styles,
            savingThrows: c.savingThrows,
            skills: c.skills,
            feats: c.feats,
            resources: c.resources,
            gold: c.gold,
            inventory: c.inventory,
            notes: c.notes,
            settings: c.settings,
            createdAt: c.createdAt,
            updatedAt: c.updatedAt
        };
    }

    function makeRegistryFile(list) {
        return {
            version: 2,
            meta: {
                description: 'Registry of RPG character files for character-select.html',
                schema: 'player-data-v2',
                updated: new Date().toISOString().slice(0, 10)
            },
            characters: list.map(c => ({
                id: c.id,
                file: `characters/${c.id}.json`,
                name: c.name,
                level: c.level,
                race: c.race,
                class: c.class,
                subclass: c.subclass,
                background: c.background && typeof c.background === 'object' ? c.background.name : c.background
            }))
        };
    }

    function downloadJson(filename, content) {
        const blob = new Blob([content], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Normalize a character record (handles legacy `abilities`/`maxHp` and new `abilityScores`/`hp`)
    function normalizeChar(raw) {
        const ch = raw && typeof raw === 'object' ? raw : {};
        const scores = ch.abilityScores || ch.abilities || {};
        const hp = ch.hp || {};
        const bg = typeof ch.background === 'string' ? { name: ch.background, bonuses: {} } : (ch.background || null);
        return {
            id: String(ch.id || 'char-' + Date.now()),
            name: ch.name || 'Unnamed',
            level: Number(ch.level) || 1,
            race: ch.race || '',
            class: ch.class || '',
            subclass: ch.subclass || '',
            background: bg,
            alignment: ch.alignment || '',
            dataSource: ch.dataSource || ch.source || null,
            proficiencyBonus: Number(ch.proficiencyBonus) || 0,
            abilityScores: {
                str: Number(scores.str) || 10,
                dex: Number(scores.dex) || 10,
                con: Number(scores.con) || 10,
                int: Number(scores.int) || 10,
                wis: Number(scores.wis) || 10,
                cha: Number(scores.cha) || 10
            },
            maxHp: ch.maxHp ?? hp.max ?? null,
            maxHpOverride: ch.maxHpOverride ?? null,
            currentHp: ch.currentHp ?? hp.current ?? ch.maxHp ?? hp.max ?? null,
            ac: ch.ac ?? null,
            acOverride: ch.acOverride ?? null,
            hitDice: (typeof ch.hitDice === 'string')
                ? { die: ch.hitDice, total: Number(ch.level) || 1, remaining: Number(ch.level) || 1 }
                : { die: (ch.hitDice && ch.hitDice.die) || 'd10', total: Number(ch.hitDice && ch.hitDice.total) || Number(ch.level) || 1, remaining: Number(ch.hitDice && ch.hitDice.remaining) || Number(ch.level) || 1 },
            armor: ch.armor || null,
            speed: ch.speed || { walk: 30, fly: null, swim: null, climb: null },
            longbowHit: ch.longbowHit ?? null,
            longbowHitOverride: ch.longbowHitOverride ?? null,
            styles: ch.styles || {},
            savingThrows: Array.isArray(ch.savingThrows) ? ch.savingThrows : [],
            skills: Array.isArray(ch.skills) ? ch.skills : [],
            feats: Array.isArray(ch.feats) ? ch.feats : [],
            resources: ch.resources || {},
            gold: Number(ch.gold) || 0,
            inventory: ch.inventory || { gold: Number(ch.gold) || 0, notes: '', items: [], quickAccessIndices: [] },
            notes: ch.notes || '',
            settings: ch.settings || {},
            createdAt: ch.createdAt || null,
            updatedAt: ch.updatedAt || null
        };
    }

    // ── Load: data/characters.json (remote) + localStorage overlay ──
    function setStatus(kind, text) {
        const el = document.getElementById('cs-status');
        if (!el) return;
        el.textContent = text;
        el.className = 'cs-status ' + kind;
    }

    async function loadRoster() {
        localOverlay = loadLocal();
        setStatus('loading', 'Loading roster…');
        const localList = Object.values(localOverlay).map(normalizeChar);
        try {
            const res = await fetch(REGISTRY_URL);
            if (res.ok) {
                const data = await res.json();
                const registry = Array.isArray(data) ? data : (Array.isArray(data.characters) ? data.characters : []);
                const merged = [];
                const fetchIds = [];
                for (const entry of registry) {
                    const id = String(entry.id || '');
                    if (!id) continue;
                    const file = String(entry.file || `characters/${id}.json`);
                    let remoteChar = null;
                    try {
                        const r = await fetch(new URL(file, new URL(REGISTRY_URL, window.location.href)));
                        if (r.ok) remoteChar = await r.json();
                    } catch (e) { /* ignore per-file errors */ }
                    if (remoteChar) {
                        fetchIds.push(id);
                        merged.push(localOverlay[id] ? { ...normalizeChar(remoteChar), ...localOverlay[id] } : normalizeChar(remoteChar));
                    }
                }
                // keep local-only characters (created in browser but not yet saved into data folder)
                localList.forEach(c => {
                    if (!fetchIds.includes(c.id) && !merged.some(m => m.id === c.id)) merged.push(c);
                });
                characters = merged.length ? merged : (localList.length ? localList : []);
                rosterSource = characters.length ? 'remote' : 'local';
                setStatus('ok', characters.length ? `Loaded ${characters.length} character file(s)` : 'No characters found');
                saveLocal();
                renderSlots();
                return;
            }
        } catch (e) {
            /* registry fetch fails (e.g. file://) → fall back to local */
        }
        characters = localList;
        rosterSource = 'local';
        setStatus('ok', localList.length ? `Using browser storage (${localList.length})` : 'Using browser storage');
        renderSlots();
    }

    async function reloadRoster() {
        localStorage.removeItem(STORAGE_KEY);
        await loadRoster();
    }

    function buildExportFiles() {
        const files = [];
        files.push({ path: 'data/characters.json', json: makeRegistryFile(characters) });
        characters.forEach(c => {
            files.push({ path: `data/${CHARACTER_DIR}/${c.id}.json`, json: makeCharacterFile(c) });
        });
        return files;
    }

    function exportRoster() {
        const files = buildExportFiles();
        const list = document.getElementById('cs-export-list');
        list.innerHTML = '';
        files.forEach(f => {
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;';
            row.innerHTML = `<code style="color:var(--secondary);font-size:0.85rem;">${esc(f.path)}</code>`;
            const btn = document.createElement('button');
            btn.className = 'btn btn-ghost';
            btn.style.cssText = 'flex:0;padding:4px 10px;font-size:0.8rem;';
            btn.textContent = '⬇';
            btn.onclick = () => {
                downloadJson(f.path, JSON.stringify(f.json, null, 2));
                setStatus('ok', `Exported ${f.path}`);
            };
            row.appendChild(btn);
            list.appendChild(row);
        });
        document.getElementById('cs-export').classList.remove('hidden');
        setStatus('ok', 'Select a file to export');
    }

    function downloadAllExport() {
        buildExportFiles().forEach((f, i) => {
            window.setTimeout(() => {
                downloadJson(f.path, JSON.stringify(f.json, null, 2));
            }, i * 400);
        });
        setStatus('ok', `Exported ${characters.length} character file(s)`);
    }

    function closeExport() {
        document.getElementById('cs-export').classList.add('hidden');
    }

    // ── Render Slots ─────────────────────────────────────────
    function renderSlots() {
        const container = document.getElementById('cs-slots');
        let html = '';

        characters.forEach((ch, idx) => {
            const mod = (score) => {
                const s = Number(score) || 10;
                const m = Math.floor((s - 10) / 2);
                return m >= 0 ? '+' + m : String(m);
            };
            const bgName = ch.background && typeof ch.background === 'object' ? ch.background.name : ch.background;
            html += `
            <div class="cs-slot" onclick="launchCharacter('${ch.id}')" data-id="${ch.id}">
                <div class="cs-slot-header">
                    <div class="cs-slot-name">${esc(ch.name || 'Unnamed')}</div>
                    <div class="cs-slot-level">Lv ${ch.level || 1}</div>
                </div>
                <div class="cs-slot-meta">
                    ${ch.systemName || (ch.system ? 'System: ' + esc(ch.system) : '') ? `<span class="cs-tag class">${esc(ch.systemName || ch.system)}</span>` : ''}
                    ${ch.race ? `<span class="cs-tag race">${esc(ch.race)}</span>` : ''}
                    ${ch.class ? `<span class="cs-tag class">${esc(ch.class)}</span>` : ''}
                    ${bgName ? `<span class="cs-tag background">${esc(String(bgName))}</span>` : ''}
                </div>
                <div class="cs-slot-stats">
                    ${ABILITY_KEYS.map(k => `
                        <div class="cs-stat-mini">
                            <div class="cs-stat-mini-label">${k.toUpperCase()}</div>
                            <div class="cs-stat-mini-value">${ch.abilityScores?.[k] ?? 10} <span style="color:var(--secondary);font-size:0.75rem;">${mod(ch.abilityScores?.[k])}</span></div>
                        </div>
                    `).join('')}
                </div>
                <div class="cs-slot-actions" onclick="event.stopPropagation()">
                    <button class="btn btn-phrase" onclick="openEditor('${ch.id}')">Edit</button>
                    <button class="btn btn-delete" onclick="requestDelete('${ch.id}')">Delete</button>
                    <button class="btn btn-launch" onclick="launchCharacter('${ch.id}')">Launch</button>
                </div>
            </div>`;
        });

        html += `
        <div class="cs-slot empty-slot" onclick="openEditor(null)">
            <div style="font-size:2rem; opacity:0.4;">+</div>
            <div style="color:var(--text-muted); font-weight:600;">New Character</div>
        </div>`;

        container.innerHTML = html;
    }

    // ── Editor ───────────────────────────────────────────────
    function openEditor(id) {
        editingId = id;
        const overlay = document.getElementById('cs-editor-overlay');
        const title = document.getElementById('cs-editor-title');

        if (id) {
            const ch = characters.find(c => c.id === id);
            if (!ch) return;
            title.textContent = 'Edit Character';
            document.getElementById('cs-name').value = ch.name || '';
            document.getElementById('cs-level').value = ch.level || 1;
            document.getElementById('cs-race').value = ch.race || '';
            document.getElementById('cs-class').value = ch.class || '';
            const bgName = ch.background && typeof ch.background === 'object' ? ch.background.name : ch.background;
            document.getElementById('cs-background').value = bgName || '';
            document.getElementById('cs-alignment').value = ch.alignment || '';
            document.getElementById('cs-source').value = ch.dataSource || '';
            document.getElementById('cs-maxhp').value = ch.maxHp ?? '';
            document.getElementById('cs-ac').value = ch.ac ?? '';
            document.getElementById('cs-hitdice').value = (ch.hitDice && ch.hitDice.die) ? ch.hitDice.die : (typeof ch.hitDice === 'string' ? ch.hitDice : 'd10');
            document.getElementById('cs-notes').value = ch.notes || '';
            for (const k of ABILITY_KEYS) {
                const el = document.getElementById('cs-ability-' + k);
                if (el) {
                    el.value = ch.abilityScores?.[k] ?? 10;
                    updateAbilityMod(el, 'cs-mod-' + k);
                }
            }
        } else {
            title.textContent = 'New Character';
            document.getElementById('cs-name').value = '';
            document.getElementById('cs-level').value = 1;
            document.getElementById('cs-race').value = '';
            document.getElementById('cs-class').value = '';
            document.getElementById('cs-background').value = '';
            document.getElementById('cs-alignment').value = '';
            document.getElementById('cs-source').value = '';
            document.getElementById('cs-maxhp').value = '';
            document.getElementById('cs-ac').value = '';
            document.getElementById('cs-hitdice').value = 'd10';
            document.getElementById('cs-notes').value = '';
            for (const k of ABILITY_KEYS) {
                const el = document.getElementById('cs-ability-' + k);
                if (el) {
                    el.value = 10;
                    updateAbilityMod(el, 'cs-mod-' + k);
                }
            }
        }

        overlay.classList.remove('hidden');
    }

    function closeEditor() {
        document.getElementById('cs-editor-overlay').classList.add('hidden');
        editingId = null;
    }

    function saveCharacter() {
        const name = document.getElementById('cs-name').value.trim();
        if (!name) {
            alert('Character name is required.');
            return;
        }

        const abilityScores = {};
        for (const k of ABILITY_KEYS) {
            const v = Number(document.getElementById('cs-ability-' + k).value);
            abilityScores[k] = (Number.isFinite(v) && v >= 1 && v <= 30) ? v : 10;
        }

        const level = Math.max(1, Math.min(20, Number(document.getElementById('cs-level').value) || 1));
        const maxHpRaw = document.getElementById('cs-maxhp').value;
        const acRaw = document.getElementById('cs-ac').value;
        const bgValue = document.getElementById('cs-background').value;
        const hitDie = document.getElementById('cs-hitdice').value;
        const prev = editingId ? characters.find(c => c.id === editingId) : null;

        const data = {
            id: editingId || 'char-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
            name,
            level,
            race: document.getElementById('cs-race').value,
            class: document.getElementById('cs-class').value,
            subclass: prev && prev.subclass ? prev.subclass : '',
            background: bgValue ? { name: bgValue, bonuses: (prev && prev.background && prev.background.bonuses) ? prev.background.bonuses : {} } : null,
            alignment: document.getElementById('cs-alignment').value,
            dataSource: document.getElementById('cs-source').value || null,
            proficiencyBonus: prev && prev.proficiencyBonus ? prev.proficiencyBonus : Math.ceil(level / 4) + 1,
            abilityScores,
            maxHp: maxHpRaw !== '' ? Number(maxHpRaw) : null,
            maxHpOverride: null,
            currentHp: maxHpRaw !== '' ? Number(maxHpRaw) : null,
            ac: acRaw !== '' ? Number(acRaw) : null,
            acOverride: null,
            hitDice: { die: hitDie, total: level, remaining: level },
            armor: prev ? prev.armor : null,
            speed: prev ? prev.speed : { walk: 30, fly: null, swim: null, climb: null },
            longbowHit: prev ? prev.longbowHit : null,
            longbowHitOverride: null,
            styles: prev ? prev.styles : {},
            savingThrows: prev ? prev.savingThrows : [],
            skills: prev ? prev.skills : [],
            feats: prev ? prev.feats : [],
            resources: prev ? prev.resources : {},
            gold: prev ? prev.gold : 0,
            inventory: prev
                ? prev.inventory
                : { gold: 0, notes: '', items: [], quickAccessIndices: [] },
            notes: document.getElementById('cs-notes').value,
            settings: prev ? prev.settings : {},
            createdAt: prev ? prev.createdAt : new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };

        if (editingId) {
            const idx = characters.findIndex(c => c.id === editingId);
            if (idx !== -1) characters[idx] = data;
        } else {
            characters.push(data);
        }

        saveLocal();
        renderSlots();
        closeEditor();
        setStatus(rosterSource === 'remote' ? 'ok' : 'ok', rosterSource === 'remote' ? 'Loaded from data folder · unsaved local edits (⬇ Export to persist)' : 'Using browser storage');
    }

    // ── Delete ───────────────────────────────────────────────
    function requestDelete(id) {
        const ch = characters.find(c => c.id === id);
        if (!ch) return;
        document.getElementById('cs-confirm-msg').textContent = `Delete "${ch.name}"? This cannot be undone.`;
        document.getElementById('cs-confirm').classList.remove('hidden');
        pendingConfirm = () => {
            characters = characters.filter(c => c.id !== id);
            saveLocal();
            renderSlots();
        };
    }

    function confirmAction() {
        if (pendingConfirm) pendingConfirm();
        closeConfirm();
    }

    function closeConfirm() {
        document.getElementById('cs-confirm').classList.add('hidden');
        pendingConfirm = null;
    }

    // ── Launch ───────────────────────────────────────────────
    function launchCharacter(id) {
        const ch = characters.find(c => c.id === id);
        if (!ch) return;
        // Save as active character and redirect to main app (legacy-compatible payload)
        localStorage.setItem('active_character_id', ch.id);
        localStorage.setItem('character.player-1', JSON.stringify({
            id: ch.id,
            name: ch.name,
            level: ch.level,
            dataSource: ch.dataSource || null,
            currentHp: ch.currentHp ?? ch.maxHp ?? null,
            maxHp: ch.maxHp ?? null,
            maxHpOverride: ch.maxHpOverride ?? null,
            ac: ch.ac ?? null,
            acOverride: ch.acOverride ?? null,
            longbowHit: ch.longbowHit ?? null,
            longbowHitOverride: ch.longbowHitOverride ?? null,
            armor: ch.armor ?? null,
            styles: ch.styles || {},
            gold: ch.gold || 0,
            inventory: ch.inventory || { gold: ch.gold || 0, notes: '', items: [], quickAccessIndices: [] },
            resources: ch.resources || {},
            abilities: ch.abilityScores || {},
            background: ch.background || null,
            notes: ch.notes || '',
            feats: ch.feats || []
        }));
        window.location.href = 'index.html';
    }

    // ── Helpers ──────────────────────────────────────────────
    function updateAbilityMod(input, modId) {
        const v = Number(input.value) || 10;
        const mod = Math.floor((v - 10) / 2);
        const el = document.getElementById(modId);
        if (el) el.textContent = mod >= 0 ? '+' + mod : String(mod);
    }

    function esc(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    // ── Init ─────────────────────────────────────────────────
    loadRoster();
    </script>
</body>
</html>
